# ============================================================
# Alembic Configuration — Sahayak AI
# ============================================================
# Alembic reads DATABASE_URL from the env at runtime via env.py
# so this file does NOT contain the real connection string.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Alembic will load the URL from app/core/config.py at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
