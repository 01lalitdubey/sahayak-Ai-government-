# Netlify Configuration for Next.js 15 (Inside frontend directory)

[build]
  publish = ".next"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "false"

[[redirects]]
  from = "/api/v1/*"
  to = "https://sahayak-ai-government.onrender.com/api/v1/:splat"
  status = 200
  force = true
